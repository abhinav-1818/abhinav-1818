<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="ad-t ad-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ad-t">Abhinav Dongrajkar</title>
  <desc id="ad-d">Cloud Engineer. AWS, Linux, Automation.</desc>
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;6 .5 .5;0 .5 .5" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ad-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ad-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#C77B9B"/>
      <stop offset="0.7" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ad-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="ad-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity="0.12" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="ad-fade" cx="0.7" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="ad-gridmask"><rect width="1200" height="360" fill="url(#ad-fade)"/></mask>
    <filter id="ad-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
    <path id="ad-orbit" d="M 940 180 m -150 0 a 150 60 -20 1 0 300 0 a 150 60 -20 1 0 -300 0"/>
    <path id="ad-flow" d="M 0 300 C 200 240 320 330 520 285 S 860 220 1000 270 S 1140 300 1200 250"/>
  </defs>

  <!-- static base (always visible) -->
  <rect width="1200" height="360" fill="url(#ad-bg)"/>
  <rect width="1200" height="360" fill="url(#ad-grid)" mask="url(#ad-gridmask)"/>
  <circle cx="940" cy="180" r="260" fill="url(#ad-glow)">
    <animate attributeName="cx" values="900;980;900" dur="14s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
    <circle cx="940" cy="180" r="110"/>
    <circle cx="940" cy="180" r="170" stroke-opacity="0.2"/>
    <use href="#ad-orbit"/>
  </g>
  <circle cx="940" cy="180" r="4" fill="#E5B5C7"/>
  <use href="#ad-flow" fill="none" stroke="#701A3D" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- motion layer (hidden when reduced motion is requested) -->
  <g class="ad-motion">
    <use href="#ad-flow" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 1400">
      <animate attributeName="stroke-dashoffset" from="1490" to="0" dur="7s" repeatCount="indefinite"/>
    </use>
    <circle r="5" fill="#F8F0F3">
      <animateMotion dur="12s" repeatCount="indefinite"><mpath href="#ad-orbit"/></animateMotion>
    </circle>
    <circle r="3" fill="#C77B9B">
      <animateMotion dur="19s" begin="-6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#ad-orbit"/></animateMotion>
    </circle>
  </g>

  <!-- text -->
  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="url(#ad-name)" letter-spacing="1">Abhinav Dongrajkar</text>
  <text x="84" y="200" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21" fill="#E5B5C7" letter-spacing="2">Cloud &amp; DevOps Engineer</text>
  <text x="84" y="236" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#C77B9B" letter-spacing="4">AWS  ·  LINUX  ·  AUTOMATION</text>

  <!-- glowing underline -->
  <g>
    <rect x="84" y="164" width="520" height="3" rx="1.5" fill="url(#ad-line)" filter="url(#ad-blur)" opacity="0.8">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="84" y="164" width="520" height="2" rx="1" fill="url(#ad-line)"/>
  </g>

  <style>@media (prefers-reduced-motion: reduce){.ad-motion{display:none}}</style>
</svg>
